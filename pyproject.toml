[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finetune"
version = "0.1.0"
description = "Reusable small-model finetuning pipelines (collect -> augment -> adapt -> train -> store -> serve)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
train = [
    "torch",
    "peft",
    "transformers",
    "datasets",
    "accelerate",
]
serve = [
    "llama-cpp-python",
]
test = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["finetune"]

[tool.pytest.ini_options]
testpaths = ["tests"]
